[package]
name = "relay-snowflakes"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = "1.0.104"
relay-svc = { path = "../relay_svc", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
