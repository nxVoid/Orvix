{{- include "orvix.validate" . }}
{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: orvix-env
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orvix.labels" (dict "root" . "name" "orvix-env" "component" "config") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $k, $val := omit (include "orvix.secretData" . | fromJson) "ORVIX_ACTIVITYPUB_SIGNING_KEY_BASE64" }}
  {{ $k }}: {{ $val | b64enc | quote }}
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: relay-unfurl-env
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orvix.labels" (dict "root" . "name" "relay-unfurl-env" "component" "config") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
{{- with get (include "orvix.secretData" . | fromJson) "ORVIX_ACTIVITYPUB_SIGNING_KEY_BASE64" }}
data:
  ORVIX_ACTIVITYPUB_SIGNING_KEY_BASE64: {{ . | b64enc | quote }}
{{- end }}
{{- end }}
