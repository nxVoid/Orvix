[workspace]
members = [
	"relay_admin",
	"relay_app_proxy",
	"relay_common",
	"relay_media_proxy",
	"relay_gifs",
	"relay_svc",
	"relay_messages",
	"relay_push",
	"relay_snowflakes",
	"tools/ci",
	"tools/dev",
	"relay_users",
	"relay_unfurl",
	"packages/markdown_parser/rust",
]
exclude = [
	"packages/markdown_parser/rust/fuzz",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
