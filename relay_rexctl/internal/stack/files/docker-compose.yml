x-orvix-rust-env: &orvix-rust-env
  <<: *orvix-env
  TOKIO_WORKER_THREADS: ${ORVIX_TOKIO_WORKER_THREADS:-2}
  MALLOC_ARENA_MAX: ${ORVIX_MALLOC_ARENA_MAX:-2}

x-orvix-logging: &orvix-logging
  driver: json-file
  options:
    max-size: ${ORVIX_LOG_MAX_SIZE:-10m}
    max-file: "${ORVIX_LOG_MAX_FILE:-3}"

x-orvix-service: &orvix-service
  restart: ${ORVIX_RESTART_POLICY:-unless-stopped}
  networks: [orvix]
  logging: *orvix-logging

x-orvix-healthcheck: &orvix-healthcheck
  interval: ${ORVIX_HEALTHCHECK_INTERVAL:-10s}
  timeout: ${ORVIX_HEALTHCHECK_TIMEOUT:-5s}
  retries: ${ORVIX_HEALTHCHECK_RETRIES:-10}
  start_period: ${ORVIX_HEALTHCHECK_START_PERIOD:-60s}
  start_interval: ${ORVIX_HEALTHCHECK_START_INTERVAL:-1s}

x-orvix-app-healthcheck: &orvix-app-healthcheck
  interval: ${ORVIX_HEALTHCHECK_INTERVAL:-10s}
  timeout: ${ORVIX_HEALTHCHECK_TIMEOUT:-5s}
  retries: ${ORVIX_APP_HEALTHCHECK_RETRIES:-30}
  start_period: ${ORVIX_APP_HEALTHCHECK_START_PERIOD:-90s}
  start_interval: ${ORVIX_HEALTHCHECK_START_INTERVAL:-1s}

x-relay-svc-healthcheck: &relay-svc-healthcheck
  <<: *orvix-app-healthcheck
  start_period: ${ORVIX_SVC_HEALTHCHECK_START_PERIOD:-60s}
  test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8090 && printf \"GET /_health HTTP/1.0\\r\\n\\r\\n\" >&3 && head -n 1 <&3 | grep -q \" 200 \"'"]

services:
  edge:
    <<: *orvix-service
    image: ${ORVIX_CADDY_IMAGE:-caddy:2.11-alpine}
    deploy:
      resources:
        limits:
          memory: ${ORVIX_CADDY_MEMORY_LIMIT:-384mb}
    ports:
      - "${ORVIX_EDGE_LISTEN_ADDRESS:+[${ORVIX_EDGE_LISTEN_ADDRESS}]:}${ORVIX_HTTP_PORT:-80}:80"
      - "${ORVIX_EDGE_LISTEN_ADDRESS:+[${ORVIX_EDGE_LISTEN_ADDRESS}]:}${ORVIX_HTTPS_PORT:-443}:443"
      - "${ORVIX_EDGE_LISTEN_ADDRESS:+[${ORVIX_EDGE_LISTEN_ADDRESS}]:}${ORVIX_HTTPS_PORT:-443}:443/udp"
    environment:
      ORVIX_EDGE_SITE_ADDRESS: ${ORVIX_EDGE_SITE_ADDRESS:-${ORVIX_CADDY_SITE_ADDRESS:-${ORVIX_PUBLIC_SCHEME:-https}://${ORVIX_DOMAIN:-}}}
      ORVIX_EDGE_TRUSTED_PROXIES: ${ORVIX_EDGE_TRUSTED_PROXIES:-127.0.0.1/32}
      ORVIX_EDGE_ENCODE: ${ORVIX_EDGE_ENCODE:-zstd gzip}
      ORVIX_EDGE_PROTOCOLS: ${ORVIX_EDGE_PROTOCOLS:-h1 h2 h3}
      ORVIX_EDGE_GLOBAL_OPTIONS: ${ORVIX_EDGE_GLOBAL_OPTIONS:-}
      ORVIX_EDGE_TLS_DIRECTIVE: ${ORVIX_EDGE_TLS:+tls ${ORVIX_EDGE_TLS:-}}
      ORVIX_ADMIN_BASE_PATH: ${ORVIX_ADMIN_BASE_PATH:-/admin}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - ./caddy.d:/etc/caddy/conf.d:ro
      - edge-data:/data
      - edge-config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      <<: *orvix-healthcheck
    depends_on:
      api: {condition: service_healthy}
      gateway: {condition: service_healthy}

  postgres:
    <<: *orvix-service
    image: ${ORVIX_POSTGRES_IMAGE:-postgres:16-alpine}
    deploy:
      resources:
        limits:
          memory: ${ORVIX_POSTGRES_MEMORY_LIMIT:-5gb}
        reservations:
          memory: ${ORVIX_POSTGRES_MEMORY_RESERVATION:-3gb}
    command: >
      postgres
      -c max_connections=${ORVIX_POSTGRES_SERVER_MAX_CONNECTIONS:-150}
      -c shared_buffers=${ORVIX_POSTGRES_SHARED_BUFFERS:-512MB}
      -c effective_cache_size=${ORVIX_POSTGRES_EFFECTIVE_CACHE_SIZE:-2GB}
      -c work_mem=${ORVIX_POSTGRES_WORK_MEM:-8MB}
      -c maintenance_work_mem=${ORVIX_POSTGRES_MAINTENANCE_WORK_MEM:-256MB}
      -c autovacuum_work_mem=${ORVIX_POSTGRES_AUTOVACUUM_WORK_MEM:-128MB}
      -c random_page_cost=${ORVIX_POSTGRES_RANDOM_PAGE_COST:-1.1}
      -c effective_io_concurrency=${ORVIX_POSTGRES_EFFECTIVE_IO_CONCURRENCY:-200}
      -c default_statistics_target=${ORVIX_POSTGRES_DEFAULT_STATISTICS_TARGET:-200}
      -c jit=${ORVIX_POSTGRES_JIT:-off}
      -c min_wal_size=${ORVIX_POSTGRES_MIN_WAL_SIZE:-80MB}
      -c max_wal_size=${ORVIX_POSTGRES_MAX_WAL_SIZE:-2GB}
      -c checkpoint_completion_target=${ORVIX_POSTGRES_CHECKPOINT_COMPLETION_TARGET:-0.9}
      -c wal_buffers=${ORVIX_POSTGRES_WAL_BUFFERS:-16MB}
      -c wal_compression=${ORVIX_POSTGRES_WAL_COMPRESSION:-zstd}
      -c bgwriter_delay=${ORVIX_POSTGRES_BGWRITER_DELAY:-50ms}
      -c bgwriter_lru_maxpages=${ORVIX_POSTGRES_BGWRITER_LRU_MAXPAGES:-1000}
      -c autovacuum_vacuum_scale_factor=${ORVIX_POSTGRES_AUTOVACUUM_VACUUM_SCALE_FACTOR:-0.05}
      -c autovacuum_analyze_scale_factor=${ORVIX_POSTGRES_AUTOVACUUM_ANALYZE_SCALE_FACTOR:-0.02}
      -c autovacuum_vacuum_cost_limit=${ORVIX_POSTGRES_AUTOVACUUM_VACUUM_COST_LIMIT:-2000}
      -c autovacuum_max_workers=${ORVIX_POSTGRES_AUTOVACUUM_MAX_WORKERS:-3}
      -c max_parallel_workers_per_gather=${ORVIX_POSTGRES_MAX_PARALLEL_WORKERS_PER_GATHER:-2}
      -c max_parallel_workers=${ORVIX_POSTGRES_MAX_PARALLEL_WORKERS:-8}
      -c track_io_timing=${ORVIX_POSTGRES_TRACK_IO_TIMING:-on}
      -c shared_preload_libraries=${ORVIX_POSTGRES_SHARED_PRELOAD_LIBRARIES:-pg_stat_statements}
    shm_size: ${ORVIX_POSTGRES_SHM_SIZE:-1gb}
    environment:
      POSTGRES_DB: ${ORVIX_POSTGRES_DATABASE:-orvix}
      POSTGRES_USER: ${ORVIX_POSTGRES_USERNAME:-orvix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      <<: *orvix-healthcheck

  valkey:
    <<: *orvix-service
    image: ${ORVIX_VALKEY_IMAGE:-valkey/valkey:9.1-alpine}
    deploy:
      resources:
        limits:
          memory: ${ORVIX_VALKEY_MEMORY_LIMIT:-256mb}
    command: ["valkey-server", "--appendonly", "yes", "--appendfsync", "${ORVIX_VALKEY_APPENDFSYNC:-everysec}", "--dir", "/data",
              "--save", "${ORVIX_VALKEY_SAVE:-}",
              "--maxmemory", "${ORVIX_VALKEY_MAXMEMORY:-192mb}",
              "--maxmemory-policy", "${ORVIX_VALKEY_MAXMEMORY_POLICY:-noeviction}"]
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      <<: *orvix-healthcheck

  nats:
    <<: *orvix-service
    image: ${ORVIX_NATS_IMAGE:-nats:2.14-alpine}
    deploy:
      resources:
        limits:
          memory: ${ORVIX_NATS_MEMORY_LIMIT:-256mb}
    environment:
      GOMEMLIMIT: ${ORVIX_NATS_GOMEMLIMIT:-200MiB}
      ORVIX_NATS_MAX_MEMORY_STORE: ${ORVIX_NATS_MAX_MEMORY_STORE:-64MB}
      ORVIX_NATS_MAX_FILE_STORE: ${ORVIX_NATS_MAX_FILE_STORE:-10GB}
    command:
      - sh
      - -c
      - >
        printf 'http_port: 8222\njetstream {\n  store_dir: /data\n  max_memory_store: %s\n  max_file_store: %s\n}\n'
        "$$ORVIX_NATS_MAX_MEMORY_STORE" "$$ORVIX_NATS_MAX_FILE_STORE" > /tmp/nats.conf
        && exec nats-server -c /tmp/nats.conf
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz"]
      <<: *orvix-healthcheck

  meilisearch:
    <<: *orvix-service
    image: ${ORVIX_MEILISEARCH_IMAGE:-getmeili/meilisearch:v1.53}
    deploy:
      resources:
        limits:
          memory: ${ORVIX_MEILISEARCH_MEMORY_LIMIT:-1536mb}
    environment:
      MEILI_ENV: ${ORVIX_MEILISEARCH_ENV:-production}
      MEILI_NO_ANALYTICS: "${ORVIX_MEILISEARCH_NO_ANALYTICS:-true}"
      MEILI_UPGRADE_DB: "true"
      MEILI_MAX_INDEXING_MEMORY: ${ORVIX_MEILISEARCH_MAX_INDEXING_MEMORY:-256mb}
      MEILI_MAX_INDEXING_THREADS: ${ORVIX_MEILISEARCH_MAX_INDEXING_THREADS:-2}
      MEILI_LOG_LEVEL: ${ORVIX_MEILISEARCH_LOG_LEVEL:-WARN}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-}
    volumes:
      - meilisearch-data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7700/health"]
      <<: *orvix-healthcheck

  seaweedfs:
    <<: *orvix-service
    image: ${ORVIX_SEAWEEDFS_IMAGE:-chrislusf/seaweedfs:4.47}
    deploy:
      resources:
        limits:
          memory: ${ORVIX_SEAWEEDFS_MEMORY_LIMIT:-2gb}
    environment:
      GOMEMLIMIT: ${ORVIX_SEAWEEDFS_GOMEMLIMIT:-1536MiB}
      WEED_MASTER_VOLUME_GROWTH_COPY_1: ${ORVIX_SEAWEEDFS_VOLUME_GROWTH:-1}
    command: ["server", "-s3", "-s3.iam=false", "-dir=/data", "-master.telemetry=${ORVIX_SEAWEEDFS_TELEMETRY:-false}", "-master.volumeSizeLimitMB=${ORVIX_SEAWEEDFS_VOLUME_SIZE_LIMIT_MB:-1024}", "-master.garbageThreshold=${ORVIX_SEAWEEDFS_GARBAGE_THRESHOLD:-0.1}", "-volume.max=${ORVIX_SEAWEEDFS_VOLUME_MAX:-10000}", "-s3.concurrentFileUploadLimit=${ORVIX_SEAWEEDFS_S3_CONCURRENT_UPLOADS:-5}"]
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      <<: *orvix-healthcheck
      retries: ${ORVIX_SEAWEEDFS_HEALTHCHECK_RETRIES:-20}
      start_period: ${ORVIX_SEAWEEDFS_HEALTHCHECK_START_PERIOD:-60s}

  seaweedfs-init:
    image: ${ORVIX_SEAWEEDFS_IMAGE:-chrislusf/seaweedfs:4.47}
    deploy:
      resources:
        limits:
          memory: ${ORVIX_SEAWEEDFS_INIT_MEMORY_LIMIT:-128mb}
    networks: [orvix]
    logging: *orvix-logging
    depends_on:
      seaweedfs: {condition: service_healthy, restart: true}
    restart: "no"
    environment:
      ORVIX_S3_ACCESS_KEY: ${ORVIX_S3_ACCESS_KEY:-}
      ORVIX_S3_SECRET_KEY: ${ORVIX_S3_SECRET_KEY:-}
      ORVIX_S3_BUCKET_CDN: ${ORVIX_S3_BUCKET_CDN:-orvix}
      ORVIX_S3_BUCKET_UPLOADS: ${ORVIX_S3_BUCKET_UPLOADS:-orvix-uploads}
      ORVIX_S3_BUCKET_REPORTS: ${ORVIX_S3_BUCKET_REPORTS:-orvix-reports}
      ORVIX_S3_BUCKET_HARVESTS: ${ORVIX_S3_BUCKET_HARVESTS:-orvix-harvests}
      ORVIX_SEAWEEDFS_INIT_ATTEMPTS: ${ORVIX_SEAWEEDFS_INIT_ATTEMPTS:-60}
      ORVIX_SEAWEEDFS_UPLOADS_TTL: ${ORVIX_SEAWEEDFS_UPLOADS_TTL:-1d}
    entrypoint:
      - /bin/sh
      - -c
      - >
        buckets="$$ORVIX_S3_BUCKET_CDN $$ORVIX_S3_BUCKET_UPLOADS $$ORVIX_S3_BUCKET_REPORTS $$ORVIX_S3_BUCKET_HARVESTS";
        missing="$$buckets";
        for attempt in $$(seq 1 $$ORVIX_SEAWEEDFS_INIT_ATTEMPTS); do
          if ! nc -z seaweedfs 9333 2>/dev/null; then
            sleep 2;
            continue;
          fi;
          listed=$$(echo "s3.bucket.list" | timeout 10 weed shell -master=seaweedfs:9333 2>&1);
          missing="";
          failure="";
          for b in $$buckets; do
            echo "$$listed" | grep -q "^[[:space:]]*$$b[[:space:]]" || missing="$${missing:+$$missing }$$b";
          done;
          if [ -z "$$missing" ]; then
            if [ "$$ORVIX_SEAWEEDFS_UPLOADS_TTL" = off ]; then
              ttl_rule="fs.configure -locationPrefix=/buckets/$$ORVIX_S3_BUCKET_UPLOADS/ -delete -apply";
            else
              ttl_rule="fs.configure -locationPrefix=/buckets/$$ORVIX_S3_BUCKET_UPLOADS/ -ttl=$$ORVIX_SEAWEEDFS_UPLOADS_TTL -apply";
            fi;
            failure="could not configure the S3 identity";
            if echo "s3.configure -user=orvix -access_key=$$ORVIX_S3_ACCESS_KEY -secret_key=$$ORVIX_S3_SECRET_KEY -actions=Admin,Read,Write,List,Tagging -apply" | timeout 10 weed shell -master=seaweedfs:9333 >/dev/null 2>&1; then
              failure="could not set the expiry of $$ORVIX_S3_BUCKET_UPLOADS";
              if echo "$$ttl_rule" | timeout 10 weed shell -master=seaweedfs:9333 >/dev/null 2>&1; then
                echo "buckets ready";
                exit 0;
              fi;
            fi;
            sleep 2;
            continue;
          fi;
          for b in $$missing; do
            echo "s3.bucket.create -name $$b" | timeout 10 weed shell -master=seaweedfs:9333 >/dev/null 2>&1;
          done;
          sleep 2;
        done;
        if [ -n "$$failure" ]; then
          echo "seaweedfs-init $$failure" >&2;
        else
          echo "seaweedfs-init could not verify buckets: $$missing" >&2;
        fi;
        exit 1;

  livekit:
    <<: *orvix-service
    image: ${ORVIX_LIVEKIT_IMAGE:-livekit/livekit-server:v1.12.0}
    deploy:
      resources:
        limits:
          memory: ${ORVIX_LIVEKIT_MEMORY_LIMIT:-512mb}
    environment:
      GOMEMLIMIT: ${ORVIX_LIVEKIT_GOMEMLIMIT:-435MiB}
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-}: ${LIVEKIT_API_SECRET:-}"
      LIVEKIT_CONFIG: |
        port: 7880
        log_level: ${ORVIX_LIVEKIT_LOG_LEVEL:-info}
        rtc:
          tcp_port: ${ORVIX_LIVEKIT_TCP_PORT:-7881}
          udp_port: ${ORVIX_LIVEKIT_UDP_PORT:-7882}
          use_external_ip: ${ORVIX_LIVEKIT_USE_EXTERNAL_IP:-true}
          node_ip: "${ORVIX_LIVEKIT_NODE_IP:-}"
          stun_servers:
            - ${ORVIX_LIVEKIT_STUN_PRIMARY:-stun.l.google.com:19302}
            - ${ORVIX_LIVEKIT_STUN_SECONDARY:-stun1.l.google.com:19302}
          turn_servers: ${ORVIX_LIVEKIT_TURN_SERVERS:-[]}
        webhook:
          api_key: ${LIVEKIT_API_KEY:-}
          urls:
            - http://api:8080/webhooks/livekit
    ports:
      - "${ORVIX_LIVEKIT_TCP_PORT:-7881}:${ORVIX_LIVEKIT_TCP_PORT:-7881}"
      - "${ORVIX_LIVEKIT_UDP_PORT:-7882}:${ORVIX_LIVEKIT_UDP_PORT:-7882}/udp"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7880/"]
      <<: *orvix-healthcheck

  api:
    <<: *orvix-service
    image: ${ORVIX_REGISTRY:-ghcr.io/${ORVIX_REGISTRY_OWNER:-orvixapp}}/relay-api:${ORVIX_IMAGE_TAG:-v1}
    deploy:
      resources:
        limits:
          memory: ${ORVIX_API_MEMORY_LIMIT:-2560mb}
        reservations:
          memory: ${ORVIX_API_MEMORY_RESERVATION:-1gb}
    environment:
      <<: *orvix-env
      ORVIX_API_PORT: "8080"
      ORVIX_SETUP_TOKEN: ${ORVIX_SETUP_TOKEN:-}
      NODE_OPTIONS: --max-old-space-size${ORVIX_API_NODE_HEAP_MB:+=}${ORVIX_API_NODE_HEAP_MB:--percentage=60}${ORVIX_API_NODE_OPTIONS:+ ${ORVIX_API_NODE_OPTIONS:-}}
      NODE_EXTRA_CA_CERTS: ${ORVIX_NODE_EXTRA_CA_CERTS:-/etc/ssl/certs/ca-certificates.crt}
      ORVIX_POSTGRES_MAX_CONNECTIONS: "${ORVIX_API_POSTGRES_MAX_CONNECTIONS:-25}"
      ORVIX_API_PRESIGNED_ATTACHMENT_UPLOADS_ENABLED: "${ORVIX_API_PRESIGNED_ATTACHMENT_UPLOADS_ENABLED:-true}"
      ORVIX_API_EMBEDDED_WORKER: "${ORVIX_API_EMBEDDED_WORKER:-false}"
      ORVIX_MEDIA_PROXY_ATTACHMENT_URL_SECRETS_BASE64: ${ORVIX_MEDIA_PROXY_ATTACHMENT_URL_SECRETS_BASE64:-}
    volumes:
      - ./ca:/etc/orvix/ca:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /_health HTTP/1.0\\r\\nHost: 127.0.0.1\\r\\n\\r\\n\" >&3 && head -n 1 <&3 | grep -q \" 200 \"'"]
      <<: *orvix-app-healthcheck
    depends_on:
      postgres: {condition: service_healthy}
      valkey: {condition: service_healthy}
      nats: {condition: service_healthy}
      meilisearch: {condition: service_healthy}
      seaweedfs-init: {condition: service_completed_successfully}
      gifs: {condition: service_healthy}
      snowflakes: {condition: service_healthy}
      messages: {condition: service_healthy}
      users: {condition: service_healthy}

  worker:
    <<: *orvix-service
    image: ${ORVIX_REGISTRY:-ghcr.io/${ORVIX_REGISTRY_OWNER:-orvixapp}}/relay-api:${ORVIX_IMAGE_TAG:-v1}
    deploy:
      replicas: ${ORVIX_WORKER_REPLICAS:-1}
      resources:
        limits:
          memory: ${ORVIX_WORKER_MEMORY_LIMIT:-2560mb}
        reservations:
          memory: ${ORVIX_WORKER_MEMORY_RESERVATION:-1gb}
    command: ["node", "dist/WorkerEntrypoint.js"]
    environment:
      <<: *orvix-env
      NODE_OPTIONS: --max-old-space-size${ORVIX_WORKER_NODE_HEAP_MB:+=}${ORVIX_WORKER_NODE_HEAP_MB:--percentage=55}${ORVIX_WORKER_NODE_OPTIONS:+ ${ORVIX_WORKER_NODE_OPTIONS:-}}
      NODE_EXTRA_CA_CERTS: ${ORVIX_NODE_EXTRA_CA_CERTS:-/etc/ssl/certs/ca-certificates.crt}
      ORVIX_API_WORKER_MODE: all_lanes
      ORVIX_API_WORKER_ENABLE_CRON_SCHEDULER: "true"
      ORVIX_POSTGRES_MAX_CONNECTIONS: "${ORVIX_WORKER_POSTGRES_MAX_CONNECTIONS:-25}"
      ORVIX_WORKER_POSTGRES_SYNCHRONOUS_COMMIT: "${ORVIX_WORKER_POSTGRES_SYNCHRONOUS_COMMIT:-}"
      ORVIX_MEDIA_PROXY_ATTACHMENT_URL_SECRETS_BASE64: ${ORVIX_MEDIA_PROXY_ATTACHMENT_URL_SECRETS_BASE64:-}
    volumes:
      - ./ca:/etc/orvix/ca:ro
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/orvix-worker-heartbeat -newermt '-30 seconds' | grep -q ."]
      <<: *orvix-app-healthcheck
      retries: ${ORVIX_WORKER_HEALTHCHECK_RETRIES:-3}
    depends_on:
      postgres: {condition: service_healthy}
      valkey: {condition: service_healthy}
      nats: {condition: service_healthy}
      seaweedfs-init: {condition: service_completed_successfully}
      snowflakes: {condition: service_healthy}
      messages: {condition: service_healthy}
      users: {condition: service_healthy}

  gateway:
    <<: *orvix-service
    image: ${ORVIX_REGISTRY:-ghcr.io/${ORVIX_REGISTRY_OWNER:-orvixapp}}/relay-gateway:${ORVIX_IMAGE_TAG:-v1}
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      resources:
        limits:
          memory: ${ORVIX_GATEWAY_MEMORY_LIMIT:-1gb}
        reservations:
          memory: ${ORVIX_GATEWAY_MEMORY_RESERVATION:-384mb}
    environment:
      <<: *orvix-env
      ORVIX_GATEWAY_PORT: "8080"
      ORVIX_GATEWAY_MEDIA_PROXY_ENDPOINT: ${ORVIX_GATEWAY_MEDIA_PROXY_ENDPOINT:-${ORVIX_MEDIA_ENDPOINT:-${ORVIX_PUBLIC_ORIGIN:-${ORVIX_PUBLIC_SCHEME:-https}://${ORVIX_DOMAIN:-}}/media}}
      ORVIX_GATEWAY_STATIC_CDN_ENDPOINT: ${ORVIX_GATEWAY_STATIC_CDN_ENDPOINT:-${ORVIX_STATIC_CDN_ENDPOINT:-${ORVIX_PUBLIC_ORIGIN:-${ORVIX_PUBLIC_SCHEME:-https}://${ORVIX_DOMAIN:-}}}}
      ORVIX_GATEWAY_LOGGER_LEVEL: ${ORVIX_GATEWAY_LOGGER_LEVEL:-}
      LOGGER_LEVEL: ${LOGGER_LEVEL:-}
      ORVIX_GATEWAY_PUSH_ENABLED: ${ORVIX_GATEWAY_PUSH_ENABLED:-}
      ORVIX_GATEWAY_PUSH_ENROLLED_CLEAR_NOTIFICATIONS_ENABLED: ${ORVIX_GATEWAY_PUSH_ENROLLED_CLEAR_NOTIFICATIONS_ENABLED:-}
      ORVIX_GATEWAY_PUSH_OUTBOX_REQUEST_TIMEOUT_MS: ${ORVIX_GATEWAY_PUSH_OUTBOX_REQUEST_TIMEOUT_MS:-}
      ORVIX_GATEWAY_PRESENCE_PUSH_BUFFER_MAX_ENTRIES: ${ORVIX_GATEWAY_PRESENCE_PUSH_BUFFER_MAX_ENTRIES:-}
      ORVIX_GATEWAY_PRESENCE_PUSH_BUFFER_MAX_BYTES: ${ORVIX_GATEWAY_PRESENCE_PUSH_BUFFER_MAX_BYTES:-}
      ORVIX_GATEWAY_HTTP_RPC_MAX_CONCURRENCY: ${ORVIX_GATEWAY_HTTP_RPC_MAX_CONCURRENCY:-}
      ORVIX_GATEWAY_NATS_RPC_MAX_HANDLERS: ${ORVIX_GATEWAY_NATS_RPC_MAX_HANDLERS:-}
      ORVIX_GATEWAY_ZSTD_WINDOW_LOG: ${ORVIX_GATEWAY_ZSTD_WINDOW_LOG:-}
      ORVIX_GATEWAY_HTTP_FAILURE_THRESHOLD: ${ORVIX_GATEWAY_HTTP_FAILURE_THRESHOLD:-}
      ORVIX_GATEWAY_HTTP_RECOVERY_TIMEOUT_MS: ${ORVIX_GATEWAY_HTTP_RECOVERY_TIMEOUT_MS:-}
      ORVIX_GATEWAY_GUILD_VISITOR_SESSIONS_MAX: ${ORVIX_GATEWAY_GUILD_VISITOR_SESSIONS_MAX:-}
      ORVIX_GATEWAY_GUILD_VISITOR_SESSIONS_FLOOR: ${ORVIX_GATEWAY_GUILD_VISITOR_SESSIONS_FLOOR:-}
      ORVIX_GATEWAY_GUILD_VISITOR_SESSIONS_PER_MEMBER: ${ORVIX_GATEWAY_GUILD_VISITOR_SESSIONS_PER_MEMBER:-}
      ORVIX_GATEWAY_GUILD_VISITOR_SESSIONS_PER_USER: ${ORVIX_GATEWAY_GUILD_VISITOR_SESSIONS_PER_USER:-}
      ORVIX_GATEWAY_GUILD_VISITOR_SESSIONS_PER_IP: ${ORVIX_GATEWAY_GUILD_VISITOR_SESSIONS_PER_IP:-}
      ORVIX_ERLANG_COOKIE: ${ORVIX_ERLANG_COOKIE:-}
      ORVIX_ERLANG_SCHEDULERS: ${ORVIX_ERLANG_SCHEDULERS:-}
      ORVIX_ERLANG_SCHEDULERS_MIN: ${ORVIX_ERLANG_SCHEDULERS_MIN:-}
      ORVIX_ERLANG_SCHEDULERS_MAX: ${ORVIX_ERLANG_SCHEDULERS_MAX:-}
      ORVIX_ERLANG_DIRTY_CPU_SCHEDULERS: ${ORVIX_ERLANG_DIRTY_CPU_SCHEDULERS:-}
      ORVIX_ERLANG_DIRTY_IO_SCHEDULERS: ${ORVIX_ERLANG_DIRTY_IO_SCHEDULERS:-}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /_health/ready HTTP/1.0\\r\\nHost: 127.0.0.1\\r\\n\\r\\n\" >&3 && head -n 1 <&3 | grep -q \" 200 \"'"]
      <<: *orvix-app-healthcheck
    depends_on:
      nats: {condition: service_healthy}
      valkey: {condition: service_healthy}

  media-proxy:
    <<: *orvix-service
    image: ${ORVIX_REGISTRY:-ghcr.io/${ORVIX_REGISTRY_OWNER:-orvixapp}}/relay-media-proxy:${ORVIX_IMAGE_TAG:-v1}
    deploy:
      resources:
        limits:
          memory: ${ORVIX_MEDIA_PROXY_MEMORY_LIMIT:-1gb}
    environment:
      <<: *orvix-env
      ORVIX_MEDIA_PROXY_PORT: "8080"
      TOKIO_WORKER_THREADS: ${ORVIX_MEDIA_PROXY_TOKIO_WORKER_THREADS:-4}
      ORVIX_MEDIA_PROXY_MODE: upload
      ORVIX_MEDIA_PROXY_STORAGE_BACKEND: s3
      ORVIX_MEDIA_PROXY_CORS_MODE: ${ORVIX_MEDIA_PROXY_CORS_MODE:-}
      ORVIX_MEDIA_PROXY_CORS_ALLOWED_ORIGINS: ${ORVIX_MEDIA_PROXY_CORS_ALLOWED_ORIGINS:-${ORVIX_PUBLIC_ORIGIN:-${ORVIX_PUBLIC_SCHEME:-https}://${ORVIX_DOMAIN:-}:${ORVIX_PUBLIC_PORT:-443}}}
      ORVIX_MEDIA_PROXY_ATTACHMENT_SIGNATURE_MODE: ${ORVIX_MEDIA_PROXY_ATTACHMENT_SIGNATURE_MODE:-}
      ORVIX_MEDIA_PROXY_ATTACHMENT_URL_SECRETS_BASE64: ${ORVIX_MEDIA_PROXY_ATTACHMENT_URL_SECRETS_BASE64:-}
      ORVIX_MEDIA_PROXY_READ_ONLY: ${ORVIX_MEDIA_PROXY_READ_ONLY:-}
      ORVIX_MEDIA_PROXY_NSFW_THRESHOLD: ${ORVIX_MEDIA_PROXY_NSFW_THRESHOLD:-}
      ORVIX_NSFW_SERVICE_ENDPOINT: ${ORVIX_NSFW_SERVICE_ENDPOINT:-}
      ORVIX_MEDIA_PROXY_MAX_NATIVE_TRANSFORMS: ${ORVIX_MEDIA_PROXY_MAX_NATIVE_TRANSFORMS:-}
      ORVIX_MEDIA_PROXY_WORKER_QUEUE_CAPACITY: ${ORVIX_MEDIA_PROXY_WORKER_QUEUE_CAPACITY:-}
      ORVIX_MEDIA_PROXY_MAX_ENCODE_DURATION_MS: ${ORVIX_MEDIA_PROXY_MAX_ENCODE_DURATION_MS:-}
      ORVIX_MEDIA_PROXY_MAX_ENCODE_FRAMES: ${ORVIX_MEDIA_PROXY_MAX_ENCODE_FRAMES:-}
      ORVIX_MEDIA_PROXY_TRANSFORM_TIMEOUT_MS: ${ORVIX_MEDIA_PROXY_TRANSFORM_TIMEOUT_MS:-}
      ORVIX_MEDIA_PROXY_TRANSFORM_CACHE_BYTES: ${ORVIX_MEDIA_PROXY_TRANSFORM_CACHE_BYTES:-}
      ORVIX_MEDIA_PROXY_TRANSFORM_CACHE_MAX_ENTRY_BYTES: ${ORVIX_MEDIA_PROXY_TRANSFORM_CACHE_MAX_ENTRY_BYTES:-}
      ORVIX_MEDIA_PROXY_TRANSFORM_CACHE_TTL_MS: ${ORVIX_MEDIA_PROXY_TRANSFORM_CACHE_TTL_MS:-}
      ORVIX_MEDIA_PROXY_SOCKET_IO_TIMEOUT_MS: ${ORVIX_MEDIA_PROXY_SOCKET_IO_TIMEOUT_MS:-}
      ORVIX_MEDIA_PROXY_SHUTDOWN_GRACE_MS: ${ORVIX_MEDIA_PROXY_SHUTDOWN_GRACE_MS:-}
      ORVIX_MEDIA_PROXY_UPLOAD_RELAY_S3_TIMEOUT_MS: ${ORVIX_MEDIA_PROXY_UPLOAD_RELAY_S3_TIMEOUT_MS:-}
      ORVIX_MEDIA_PROXY_UPLOAD_RELAY_BUFFERED_RETRY_BYTES: ${ORVIX_MEDIA_PROXY_UPLOAD_RELAY_BUFFERED_RETRY_BYTES:-}
      ORVIX_MEDIA_PROXY_UPLOAD_RELAY_BUFFERED_RETRY_TOTAL_BYTES: ${ORVIX_MEDIA_PROXY_UPLOAD_RELAY_BUFFERED_RETRY_TOTAL_BYTES:-}
      ORVIX_MEDIA_PROXY_UPLOAD_RELAY_SPOOL_DIR: ${ORVIX_MEDIA_PROXY_UPLOAD_RELAY_SPOOL_DIR:-}
      ORVIX_MEDIA_PROXY_UPLOAD_RELAY_SPOOL_CHUNK_BYTES: ${ORVIX_MEDIA_PROXY_UPLOAD_RELAY_SPOOL_CHUNK_BYTES:-}
      ORVIX_MEDIA_PROXY_UPLOAD_RELAY_SPOOL_MAX_TOTAL_BYTES: ${ORVIX_MEDIA_PROXY_UPLOAD_RELAY_SPOOL_MAX_TOTAL_BYTES:-2147483648}
      ORVIX_S3_SESSION_TOKEN: ${ORVIX_S3_SESSION_TOKEN:-}
      ORVIX_S3_READ_ENDPOINT: ${ORVIX_S3_READ_ENDPOINT:-}
      ORVIX_S3_READ_BUCKET: ${ORVIX_S3_READ_BUCKET:-}
      ORVIX_S3_READ_BUCKET_STYLE: ${ORVIX_S3_READ_BUCKET_STYLE:-}
      ORVIX_S3_READ_SIGNED: "${ORVIX_S3_READ_SIGNED:-true}"
    volumes:
      - media-proxy-tmp:/tmp
    healthcheck:
      test: ["CMD", "/usr/local/bin/relay-media-proxy", "healthcheck"]
      <<: *orvix-healthcheck
      interval: ${ORVIX_MEDIA_PROXY_HEALTHCHECK_INTERVAL:-30s}
    depends_on:
      seaweedfs-init: {condition: service_completed_successfully}
      nats: {condition: service_healthy}

  push:
    <<: *orvix-service
    image: ${ORVIX_REGISTRY:-ghcr.io/${ORVIX_REGISTRY_OWNER:-orvixapp}}/relay-push:${ORVIX_IMAGE_TAG:-v1}
    deploy:
      resources:
        limits:
          memory: ${ORVIX_PUSH_MEMORY_LIMIT:-256mb}
    environment:
      <<: *orvix-rust-env
      ORVIX_PUSH_SERVICE_QUEUE_CAPACITY: ${ORVIX_PUSH_SERVICE_QUEUE_CAPACITY:-}
      ORVIX_PUSH_SERVICE_SEND_CONCURRENCY: ${ORVIX_PUSH_SERVICE_SEND_CONCURRENCY:-}
      ORVIX_PUSH_SERVICE_APNS_BASE_URL: ${ORVIX_PUSH_SERVICE_APNS_BASE_URL:-}
      ORVIX_PUSH_SERVICE_FCM_BASE_URL: ${ORVIX_PUSH_SERVICE_FCM_BASE_URL:-}
      ORVIX_PUSH_SERVICE_MANAGED_RELAY_HOSTS: ${ORVIX_PUSH_SERVICE_MANAGED_RELAY_HOSTS:-}
      ORVIX_PUSH_SERVICE_OWN_RELAY_HOSTS: ${ORVIX_PUSH_SERVICE_OWN_RELAY_HOSTS:-}
      ORVIX_PUSH_SERVICE_PRIVATE_HOSTS: ${ORVIX_PUSH_SERVICE_PRIVATE_HOSTS:-}
      ORVIX_PUSH_SERVICE_RELAY_CONSENT_ACCEPTED: ${ORVIX_PUSH_SERVICE_RELAY_CONSENT_ACCEPTED:-}
      ORVIX_PUSH_APNS_DEFAULT_ENVIRONMENT: ${ORVIX_PUSH_APNS_DEFAULT_ENVIRONMENT:-}
      ORVIX_PUSH_FCM_ENABLED: ${ORVIX_PUSH_FCM_ENABLED:-}
      ORVIX_PUSH_FCM_PROJECT_ID: ${ORVIX_PUSH_FCM_PROJECT_ID:-}
      ORVIX_PUSH_FCM_CLIENT_EMAIL: ${ORVIX_PUSH_FCM_CLIENT_EMAIL:-}
      ORVIX_PUSH_FCM_PRIVATE_KEY: ${ORVIX_PUSH_FCM_PRIVATE_KEY:-}
      ORVIX_PUSH_FCM_PRIVATE_KEY_PATH: ${ORVIX_PUSH_FCM_PRIVATE_KEY_PATH:-}
      ORVIX_PUSH_FCM_SERVICE_ACCOUNT_JSON_PATH: ${ORVIX_PUSH_FCM_SERVICE_ACCOUNT_JSON_PATH:-}
      ORVIX_PUSH_FCM_TOKEN_URI: ${ORVIX_PUSH_FCM_TOKEN_URI:-}
      ORVIX_PUSH_FCM_APPS: ${ORVIX_PUSH_FCM_APPS:-}
    healthcheck:
      test: ["CMD", "/usr/local/bin/relay-push", "healthcheck"]
      <<: *orvix-app-healthcheck
      start_period: ${ORVIX_SVC_HEALTHCHECK_START_PERIOD:-60s}
    depends_on:
      nats: {condition: service_healthy}
      api: {condition: service_healthy}

  static-proxy:
    <<: *orvix-service
    image: ${ORVIX_REGISTRY:-ghcr.io/${ORVIX_REGISTRY_OWNER:-orvixapp}}/relay-static:${ORVIX_IMAGE_TAG:-v1}
    deploy:
      resources:
        limits:
          memory: ${ORVIX_STATIC_PROXY_MEMORY_LIMIT:-256mb}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/avatars/0.png"]
      <<: *orvix-healthcheck

  app-proxy:
    <<: *orvix-service
    image: ${ORVIX_REGISTRY:-ghcr.io/${ORVIX_REGISTRY_OWNER:-orvixapp}}/relay-app-proxy-self-hosted:${ORVIX_IMAGE_TAG:-v1}
    deploy:
      resources:
        limits:
          memory: ${ORVIX_APP_PROXY_MEMORY_LIMIT:-256mb}
    environment:
      RUST_LOG: ${RUST_LOG:-}
      TOKIO_WORKER_THREADS: ${ORVIX_TOKIO_WORKER_THREADS:-2}
      ORVIX_APP_PROXY_PORT: "8080"
      ORVIX_S3_PUBLIC_ENDPOINT: ${ORVIX_S3_PUBLIC_ENDPOINT:-}
      ORVIX_S3_BUCKET_UPLOADS: ${ORVIX_S3_BUCKET_UPLOADS:-orvix-uploads}
      ORVIX_STATIC_CDN_ENDPOINT: ${ORVIX_STATIC_CDN_ENDPOINT:-}
      ORVIX_MEDIA_ENDPOINT: ${ORVIX_MEDIA_ENDPOINT:-}
      ORVIX_APP_PRODUCT_NAME: ${ORVIX_APP_PRODUCT_NAME:-}
      ORVIX_APP_ICON_URL: ${ORVIX_APP_ICON_URL:-}
      ORVIX_APP_SYMBOL_URL: ${ORVIX_APP_SYMBOL_URL:-}
      ORVIX_APP_LOGO_URL: ${ORVIX_APP_LOGO_URL:-}
      ORVIX_APP_WORDMARK_URL: ${ORVIX_APP_WORDMARK_URL:-}
      ORVIX_APP_FAVICON_URL: ${ORVIX_APP_FAVICON_URL:-}
      ORVIX_APP_FAVICON_DARK_URL: ${ORVIX_APP_FAVICON_DARK_URL:-}
      ORVIX_APP_SIGN_IN_BACKDROP_URL: ${ORVIX_APP_SIGN_IN_BACKDROP_URL:-}
      ORVIX_APP_THEME_COLOR: ${ORVIX_APP_THEME_COLOR:-}
      ORVIX_APP_STATUS_PAGE_URL: ${ORVIX_APP_STATUS_PAGE_URL:-}
      DISCOVERY_UPSTREAM_URL: http://edge:8088/.well-known/fluxer
      DISCOVERY_REFRESH_INTERVAL_MS: ${DISCOVERY_REFRESH_INTERVAL_MS:-5000}
      ORVIX_APP_PROXY_INDEX_UPSTREAM_URL: ${ORVIX_APP_PROXY_INDEX_UPSTREAM_URL:-}
      ORVIX_APP_PROXY_SAME_ORIGIN_HOSTS: ${ORVIX_APP_PROXY_SAME_ORIGIN_HOSTS:-}
      ORVIX_APP_PROXY_MANIFEST_SCOPE_EXTENSIONS: ${ORVIX_APP_PROXY_MANIFEST_SCOPE_EXTENSIONS:-}
      ORVIX_LIVEKIT_URL: ${ORVIX_LIVEKIT_URL:-}
      ORVIX_CSP_EXTRA_DEFAULT_SRC: ${ORVIX_CSP_EXTRA_DEFAULT_SRC:-}
      ORVIX_CSP_EXTRA_CONNECT_SRC: ${ORVIX_CSP_EXTRA_CONNECT_SRC:-}
      ORVIX_CSP_EXTRA_IMG_SRC: ${ORVIX_CSP_EXTRA_IMG_SRC:-}
      ORVIX_CSP_EXTRA_MEDIA_SRC: ${ORVIX_CSP_EXTRA_MEDIA_SRC:-}
      ORVIX_CSP_EXTRA_FONT_SRC: ${ORVIX_CSP_EXTRA_FONT_SRC:-}
      ORVIX_CSP_EXTRA_SCRIPT_SRC: ${ORVIX_CSP_EXTRA_SCRIPT_SRC:-}
      ORVIX_CSP_EXTRA_STYLE_SRC: ${ORVIX_CSP_EXTRA_STYLE_SRC:-}
      ORVIX_CSP_EXTRA_FRAME_SRC: ${ORVIX_CSP_EXTRA_FRAME_SRC:-}
      ORVIX_CSP_EXTRA_WORKER_SRC: ${ORVIX_CSP_EXTRA_WORKER_SRC:-}
      ORVIX_CSP_EXTRA_MANIFEST_SRC: ${ORVIX_CSP_EXTRA_MANIFEST_SRC:-}
      ORVIX_CSP_REPORT_URI: ${ORVIX_CSP_REPORT_URI:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/_ready"]
      <<: *orvix-healthcheck
      interval: ${ORVIX_APP_PROXY_HEALTHCHECK_INTERVAL:-30s}
    depends_on:
      api: {condition: service_healthy}
      edge: {condition: service_healthy}

  snowflakes:
    <<: *orvix-service
    stop_grace_period: 30s
    image: ${ORVIX_REGISTRY:-ghcr.io/${ORVIX_REGISTRY_OWNER:-orvixapp}}/relay-snowflakes:${ORVIX_IMAGE_TAG:-v1}
    deploy:
      resources:
        limits:
          memory: ${ORVIX_SNOWFLAKES_MEMORY_LIMIT:-256mb}
    environment:
      <<: *orvix-rust-env
      ORVIX_SVC_NAME: snowflakes
      ORVIX_SVC_MODE: combined
    healthcheck: *relay-svc-healthcheck
    depends_on:
      nats: {condition: service_healthy}

  users:
    <<: *orvix-service
    stop_grace_period: 30s
    image: ${ORVIX_REGISTRY:-ghcr.io/${ORVIX_REGISTRY_OWNER:-orvixapp}}/relay-users:${ORVIX_IMAGE_TAG:-v1}
    deploy:
      resources:
        limits:
          memory: ${ORVIX_USERS_MEMORY_LIMIT:-256mb}
    environment:
      <<: *orvix-rust-env
      ORVIX_SVC_NAME: users
      ORVIX_SVC_MODE: combined
      ORVIX_POSTGRES_MAX_CONNECTIONS: "${ORVIX_USERS_POSTGRES_MAX_CONNECTIONS:-20}"
    healthcheck: *relay-svc-healthcheck
    depends_on:
      nats: {condition: service_healthy}
      postgres: {condition: service_healthy}

  gifs:
    <<: *orvix-service
    stop_grace_period: 30s
    image: ${ORVIX_REGISTRY:-ghcr.io/${ORVIX_REGISTRY_OWNER:-orvixapp}}/relay-gifs:${ORVIX_IMAGE_TAG:-v1}
    deploy:
      resources:
        limits:
          memory: ${ORVIX_GIFS_MEMORY_LIMIT:-256mb}
    environment:
      <<: *orvix-rust-env
      ORVIX_SVC_NAME: gifs
      ORVIX_SVC_MODE: combined
      ORVIX_GIFS_SHARD_CACHE_MAX_BYTES: ${ORVIX_GIFS_SHARD_CACHE_MAX_BYTES:-134217728}
    healthcheck: *relay-svc-healthcheck
    depends_on:
      nats: {condition: service_healthy}

  messages:
    <<: *orvix-service
    stop_grace_period: 30s
    image: ${ORVIX_REGISTRY:-ghcr.io/${ORVIX_REGISTRY_OWNER:-orvixapp}}/relay-messages:${ORVIX_IMAGE_TAG:-v1}
    deploy:
      resources:
        limits:
          memory: ${ORVIX_MESSAGES_MEMORY_LIMIT:-256mb}
    environment:
      <<: *orvix-rust-env
      ORVIX_SVC_NAME: messages
      ORVIX_SVC_MODE: combined
      ORVIX_POSTGRES_MAX_CONNECTIONS: "${ORVIX_MESSAGES_POSTGRES_MAX_CONNECTIONS:-20}"
    healthcheck: *relay-svc-healthcheck
    depends_on:
      nats: {condition: service_healthy}
      postgres: {condition: service_healthy}

  unfurl:
    <<: *orvix-service
    stop_grace_period: 30s
    image: ${ORVIX_REGISTRY:-ghcr.io/${ORVIX_REGISTRY_OWNER:-orvixapp}}/relay-unfurl:${ORVIX_IMAGE_TAG:-v1}
    deploy:
      resources:
        limits:
          memory: ${ORVIX_UNFURL_MEMORY_LIMIT:-256mb}
    environment:
      <<: *orvix-rust-env
      ORVIX_SVC_NAME: unfurl
      ORVIX_SVC_MODE: combined
      ORVIX_MEDIA_PROXY_ENDPOINT: http://media-proxy:8080
      ORVIX_ACTIVITYPUB_SIGNING_KEY_BASE64: ${ORVIX_ACTIVITYPUB_SIGNING_KEY_BASE64:-}
    healthcheck: *relay-svc-healthcheck
    depends_on:
      nats: {condition: service_healthy}

  admin:
    <<: *orvix-service
    image: ${ORVIX_REGISTRY:-ghcr.io/${ORVIX_REGISTRY_OWNER:-orvixapp}}/relay-admin:${ORVIX_IMAGE_TAG:-v1}
    deploy:
      resources:
        limits:
          memory: ${ORVIX_ADMIN_MEMORY_LIMIT:-256mb}
    environment:
      <<: *orvix-rust-env
      ORVIX_ADMIN_PORT: "8080"
      ORVIX_ADMIN_BASE_PATH: ${ORVIX_ADMIN_BASE_PATH:-/admin}
      ORVIX_API_ENDPOINT: http://api:8080
      ORVIX_API_PUBLIC_ENDPOINT: ${ORVIX_API_ENDPOINT:-}
      ORVIX_STATIC_CDN_ENDPOINT: ${ORVIX_STATIC_CDN_ENDPOINT:-${ORVIX_PUBLIC_ORIGIN:-${ORVIX_PUBLIC_SCHEME:-https}://${ORVIX_DOMAIN:-}}}
      ORVIX_ADMIN_SSO_CLIENT_SECRET: ${ORVIX_ADMIN_SSO_CLIENT_SECRET:-}
      ORVIX_ADMIN_SSO_DISPLAY_NAME: ${ORVIX_ADMIN_SSO_DISPLAY_NAME:-}
      ORVIX_ADMIN_SSO_ONLY: ${ORVIX_ADMIN_SSO_ONLY:-}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /_health HTTP/1.0\\r\\n\\r\\n\" >&3 && head -n 1 <&3 | grep -q \" 200 \"'"]
      <<: *orvix-app-healthcheck
      start_period: ${ORVIX_SVC_HEALTHCHECK_START_PERIOD:-60s}
    depends_on:
      api: {condition: service_healthy}

networks:
  orvix:
    driver: bridge

volumes:
  edge-data:
  edge-config:
  postgres-data:
  valkey-data:
  nats-data:
  meilisearch-data:
  seaweedfs-data:
  media-proxy-tmp:
